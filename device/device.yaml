# Что физически подключено к Raspberry Pi.
#
# Этот файл — источник реестров ламп и датчиков (docs/model.md).
# При первом запуске устройство заполняет из него таблицы в базе.
# Комнаты здесь не описаны: их создаёт пользователь через API.
#
# Нумерация ножек — BCM (GPIO17 = физический контакт 11).
# Ножки 2 и 3 заняты шиной I2C, их для ламп не используем.
# Здесь заняты все 24 свободные ножки (BCM 4–27), поэтому ламп ровно 8.
# Ножки 14 и 15 (UART) и 7–11 (SPI) на Pi должны быть свободны: эти интерфейсы выключаем в настройках.

site:
  name: "Квартира"
  tariff_rub_per_kwh: 6.0

# Все лампы — CCT-ленты: реле + тёплый канал + холодный канал (3 ножки).
# lux_at_full — сколько lux лампа даёт на 100 % (используется только в sim).
lamps:
  - id: 1
    name: "Люстра"
    pins: { relay: 5, warm: 17, cool: 27 }
    max_power_w: 24
    lux_at_full: 400
  - id: 2
    name: "Торшер"
    pins: { relay: 22, warm: 18, cool: 25 }
    max_power_w: 10
    lux_at_full: 160
  - id: 3
    name: "Бра"
    pins: { relay: 4, warm: 12, cool: 8 }
    max_power_w: 4
    lux_at_full: 60
  - id: 4
    name: "Основной свет"
    pins: { relay: 16, warm: 20, cool: 21 }
    max_power_w: 18
    lux_at_full: 300
  - id: 5
    name: "Над столом"
    pins: { relay: 26, warm: 19, cool: 10 }
    max_power_w: 12
    lux_at_full: 200
  - id: 6
    name: "Потолок"
    pins: { relay: 6, warm: 23, cool: 24 }
    max_power_w: 15
    lux_at_full: 250
  - id: 7
    name: "Ночник"
    pins: { relay: 7, warm: 13, cool: 9 }
    max_power_w: 3
    lux_at_full: 50
  - id: 8
    name: "Светильник"
    pins: { relay: 11, warm: 14, cool: 15 }
    max_power_w: 8
    lux_at_full: 130

# Датчик — TCS34725 на шине I2C-1, адрес 0x29 (фиксированный).
# Если датчиков больше одного, у КАЖДОГО должен быть свой канал мультиплексора
# TCA9548A (адрес 0x70), mux_channel 0..7. Датчик без канала при открытом канале
# другого датчика отвечал бы с ним по одному адресу. Один датчик без мультиплексора — null.
sensors:
  - id: 1
    name: "Гостиная"
    chip: TCS34725
    bus: "I2C-1"
    address: 0x29
    mux_channel: 0
    window: 1.0          # доля уличного света, попадающая в комнату (используется только в sim)
  - id: 2
    name: "Кухня"
    chip: TCS34725
    bus: "I2C-1"
    address: 0x29
    mux_channel: 1
    window: 0.8
  - id: 3
    name: "Спальня"
    chip: TCS34725
    bus: "I2C-1"
    address: 0x29
    mux_channel: 2
    window: 0.6
